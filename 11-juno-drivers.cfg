# Append, never assign: the admin's GRUB_CMDLINE_LINUX from /etc/default/grub
# must survive. The guard keeps this conffile sourceable after `apt remove`
# deletes the helper (grub-mkconfig sources every drop-in under set -e).
GRUB_CMDLINE_LINUX="$GRUB_CMDLINE_LINUX $(/usr/share/junocomp/juno-grub-cmdline 2>/dev/null || true)"
GRUB_TIMEOUT_STYLE=menu
GRUB_TIMEOUT=5
GRUB_DISABLE_RECOVERY="false"
