name: build

# Builds this fork's deb, installs it in a clean debian:sid container
# (test-install.sh does both), and attaches it to the `builds` release. The apt repository at DiamonDinoia/apt republishes exactly these
# bytes, verified against the digest GitHub reports for each asset, so the
# served package always matches what this CI tested.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debs
  cancel-in-progress: false

jobs:
  build:
    # The upstream watcher's keepalive commit never reaches this job: pushes
    # made with GITHUB_TOKEN do not trigger workflows, so no guard is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y build-essential dpkg-dev debhelper

      # Builds with dpkg-buildpackage and checks the result by installing it
      # where a user would. A postinst that fails in a container would fail the
      # same way on a live system, so this test is what the apt repository's
      # own CI relies on for this package.
      - name: Build and install-test the packages
        run: ./test-install.sh

      - name: Publish the debs as release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view builds >/dev/null 2>&1 ||
            gh release create builds --notes "Built debs. Do not delete."
          for deb in ../*.deb; do
            [ -f "$deb" ] || { echo "no debs built"; exit 1; }
            gh release upload builds "$deb" --clobber
            # The apt repository afterwards pins and serves whatever the
            # upload left, so the upload has to equal the file the container
            # test just installed. Without this check a mangled upload is
            # green here and hash-fails downstream, a day later.
            remote=$(gh release view builds --json assets \
              --jq ".assets[] | select(.name == \"$(basename "$deb")\") | .digest")
            [ "$remote" = "sha256:$(sha256sum "$deb" | cut -d' ' -f1)" ] ||
              { echo "FAIL  uploaded $(basename "$deb") hashes $remote, not the local bytes"; exit 1; }
          done
