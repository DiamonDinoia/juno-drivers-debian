name: upstream

# Juno publishes no tags and no releases: upstream marks a release with a
# commit titled "New Release vX.Y.Z~debian" and a debian/changelog entry, so
# the changelog is what this watches. The mail comes from the issue: GitHub
# always notifies an assignee, whatever the repository's watch setting is.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      selftest:
        description: Create then delete a dummy issue, proving the mail path
        type: boolean
        default: false

permissions:
  contents: write   # the keepalive below pushes an empty commit
  issues: write

# The default shell is `bash -e`, which reports a pipeline's last exit status,
# so a curl that fails inside `./upstream-check.sh | tee` would pass the step
# and the watch would go quiet without saying so. `shell: bash` is `-eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Before trusting the answer, prove the comparison still works. The two
      # sides spell the same release differently, ~debian against +local1, and
      # a plain dpkg comparison of those gets it backwards.
      - name: Self-test the version comparison
        run: ./upstream-check.sh --selftest

      - name: Compare upstream's changelog with ours
        id: v
        run: ./upstream-check.sh | tee -a "$GITHUB_OUTPUT"

      - name: Open an issue, which is what sends the mail
        if: steps.v.outputs.newer == 'yes' || steps.v.outputs.grub_newer == 'yes' || inputs.selftest == true
        env:
          GH_TOKEN: ${{ github.token }}
          UP: ${{ steps.v.outputs.upstream }}
          MINE: ${{ steps.v.outputs.mine }}
          NEWER: ${{ steps.v.outputs.newer }}
          GRUB_UP: ${{ steps.v.outputs.grub_upstream }}
          GRUB_MINE: ${{ steps.v.outputs.grub_mine }}
          GRUB_NEWER: ${{ steps.v.outputs.grub_newer }}
          SELFTEST: ${{ inputs.selftest }}
        run: |
          set -euo pipefail

          # A passing scheduled run proves only the compare branch; the create
          # branch is the one that mails, and it breaks silently otherwise.
          # Exercise it once, then close the evidence.
          if [ "$SELFTEST" = true ]; then
            url=$(gh issue create --title "upstream workflow selftest" \
              --assignee "${{ github.repository_owner }}" \
              --body "A real upstream release opens an issue like this one. The workflow closes it right away; nothing to do.")
            gh issue view "$url" --json assignees --jq '.assignees[0].login' |
              grep -qx "${{ github.repository_owner }}"
            gh issue close "$url"
            echo "selftest issue created, assigned and closed"
            exit 0
          fi

          seen=$(gh issue list --state all --limit 1000 --json title --jq '.[].title')

          if [ "$NEWER" = yes ]; then
            title="upstream juno-drivers $UP"
            if grep -Fxq "$title" <<<"$seen"; then
              echo "already reported, nothing to send"
            else
              gh issue create --title "$title" --assignee "${{ github.repository_owner }}" \
                --body "Upstream is at \`$UP\`. This fork's \`debian/changelog\` says \`$MINE\`.

          To take it (dch lives in devscripts):

              git fetch upstream
              git rebase upstream/main
              dch -v ${UP%~debian}+diamon1 'rebase onto upstream $UP'

          Upstream commits: https://gitlab.com/junocomp/juno-drivers-debian/-/commits/main

          Opened by the \`upstream\` workflow, which reads upstream's changelog daily."
            fi
          fi

          if [ "$GRUB_NEWER" = yes ]; then
            title="upstream juno-grub $GRUB_UP"
            if grep -Fxq "$title" <<<"$seen"; then
              echo "already reported, nothing to send"
            else
              gh issue create --title "$title" --assignee "${{ github.repository_owner }}" \
                --body "juno-grub upstream is at \`$GRUB_UP\`; the vendored \`juno-grub-cmdline\` was synced from \`$GRUB_MINE\`.

          To resync: diff \`juno-grub-cmdline\` against
          https://gitlab.com/junocomp/juno-grub/-/raw/main/juno-grub/juno-grub,
          apply the functional hunks, and bump the version in the vendored
          header comment.

          Opened by the \`upstream\` workflow, which reads upstream's changelog daily."
            fi
          fi

      # GitHub disables a scheduled workflow after 60 days of repository
      # inactivity, and this repository's only activity is a human pushing a
      # rebase — which is what the watch exists to announce. Upstream's own
      # history has 70- and 181-day release gaps, so the watch would reliably
      # be off precisely when a release lands. An empty commit each time the
      # newest commit nears the limit keeps the schedule alive; the gap means
      # this costs nothing most of the year.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          (( age > 45 * 86400 )) || { echo "last commit is $(( age / 86400 )) days old, nothing to do"; exit 0; }
          git commit --allow-empty -m "ci: keepalive, so a 60-day-quiet schedule stays on"
          git push
